<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAKDZISIAJ.PL</title>
<style>
:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --text: #111111;
  --muted: #757575;
  --line: #e7e7e4;
  --soft: #f1f1ef;
  --shadow: 0 16px 45px rgba(0,0,0,.06);
  --radius: 24px;
  --button-text: #ffffff;
  --overlay: rgba(0,0,0,.28);
  --floating: rgba(255,255,255,.88);
}

html[data-theme="dark"] {
  --bg: #0b0b0b;
  --surface: #121212;
  --text: #f5f5f2;
  --muted: #9a9a94;
  --line: #292927;
  --soft: #1a1a18;
  --shadow: 0 16px 45px rgba(0,0,0,.28);
  --button-text: #0b0b0b;
  --overlay: rgba(0,0,0,.58);
  --floating: rgba(18,18,18,.9);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  min-height: 100vh;
  padding: 96px clamp(20px,5vw,72px) 56px;
  -webkit-font-smoothing: antialiased;
  transition: background-color .45s ease, color .45s ease;
}

body, .side-panel, .start-screen, .denied-screen, .city-search, .period-row, .forecast-row, .meta-item, .selected-box {
  transition: background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease;
}
button, input { font: inherit; }

/* MENU */
.ham-btn {
  position: fixed; top: 24px; left: 24px; z-index: 1100;
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--floating); border: 1px solid var(--line);
  box-shadow: 0 6px 24px rgba(0,0,0,.05); backdrop-filter: blur(14px);
  cursor: pointer; display: grid; place-content: center; gap: 5px;
}
.ham-btn span { width: 18px; height: 1.5px; background: var(--text); display:block; transition:.2s ease; }
.ham-btn:hover { transform: translateY(-1px); }

.theme-btn {
  position: fixed; top: 24px; right: 24px; z-index: 1100;
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--floating); color: var(--text);
  box-shadow: 0 6px 24px rgba(0,0,0,.05); backdrop-filter: blur(14px);
  cursor: pointer; display: grid; place-items: center; overflow: hidden;
  transition: transform .2s ease, background-color .45s ease, color .45s ease, border-color .45s ease;
}
.theme-btn:hover { transform: translateY(-1px) rotate(5deg); }
.theme-icon { position:absolute; width:21px; height:21px; transition: opacity .38s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
.theme-icon svg { width:100%; height:100%; display:block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.theme-sun { opacity:1; transform:rotate(0deg) scale(1); }
.theme-moon { opacity:0; transform:rotate(-70deg) scale(.55); }
html[data-theme="dark"] .theme-sun { opacity:0; transform:rotate(80deg) scale(.55); }
html[data-theme="dark"] .theme-moon { opacity:1; transform:rotate(0deg) scale(1); }

@media (prefers-reduced-motion: reduce) {
  body, .side-panel, .start-screen, .denied-screen, .city-search, .period-row, .forecast-row, .meta-item, .selected-box,
  .theme-btn, .theme-icon { transition: none !important; }
}

.panel-overlay { position: fixed; inset: 0; z-index: 1040; display:none; background: var(--overlay); backdrop-filter: blur(3px); }
.panel-overlay.open { display:block; }
.side-panel {
  position: fixed; top:0; left:0; width:min(430px,92vw); height:100vh; z-index:1050;
  background: var(--surface); border-right:1px solid var(--line);
  transform: translateX(-100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto; padding: 88px 28px 32px; display:flex; flex-direction:column; gap:18px;
  box-shadow: 16px 0 48px rgba(0,0,0,.08);
}
.side-panel.open { transform:translateX(0); }
.panel-top { display:flex; justify-content:space-between; align-items:center; }
.panel-title, .label, .search-label, .meta-lbl {
  font-size: 12px; font-weight:600; color:var(--muted); letter-spacing:.08em; text-transform:uppercase;
}
.panel-close { background:none; border:0; color:var(--muted); cursor:pointer; font-size:18px; padding:8px; border-radius:50%; }
.panel-close:hover { color:var(--text); background:var(--soft); }


/* PANEL TABS + CALENDAR */
.panel-nav {
  display:grid; grid-template-columns:1fr 1fr; gap:6px;
  padding:5px; border:1px solid var(--line); background:var(--soft);
  border-radius:14px;
}
.panel-tab {
  border:0; background:transparent; color:var(--muted); cursor:pointer;
  border-radius:10px; padding:10px 12px; font-size:13px; font-weight:650;
  transition:background-color .2s ease,color .2s ease,box-shadow .2s ease;
}
.panel-tab.active {
  background:var(--surface); color:var(--text);
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.panel-view { display:none; }
.panel-view.active { display:block; }

.calendar-shell { display:flex; flex-direction:column; gap:16px; }
.calendar-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.calendar-month {
  font-size:24px; font-weight:720; letter-spacing:-.035em; text-transform:capitalize;
}
.calendar-nav-btn {
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); color:var(--text); cursor:pointer; display:grid; place-items:center;
  font-size:18px; line-height:1; transition:.18s ease;
}
.calendar-nav-btn:hover { background:var(--soft); transform:translateY(-1px); }
.calendar-weekdays, .calendar-grid {
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px;
}
.calendar-weekdays span {
  text-align:center; color:var(--muted); font-size:10px; font-weight:700;
  text-transform:uppercase; padding:4px 0 6px;
}
.calendar-day {
  position:relative; aspect-ratio:1; min-width:0;
  border:1px solid transparent; background:transparent; color:var(--text);
  border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:12px; cursor:pointer; transition:.16s ease;
}
.calendar-day:hover { background:var(--soft); }
.calendar-day.outside { color:var(--muted); opacity:.34; cursor:default; }
.calendar-day.sunday { color:var(--muted); }
.calendar-day.today {
  background:var(--text); color:var(--button-text); font-weight:750;
}
.calendar-day.selected:not(.today) {
  border-color:var(--text); font-weight:700;
}
.calendar-day.has-event::after {
  content:''; position:absolute; bottom:5px; width:4px; height:4px;
  border-radius:50%; background:currentColor; opacity:.7;
}
.calendar-day.today.has-event::after { background:var(--button-text); }
.calendar-day.public-holiday:not(.today) { background:var(--soft); }

.calendar-info {
  border-top:1px solid var(--line); padding-top:16px;
}
.calendar-info-date {
  color:var(--muted); font-size:11px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px;
}
.calendar-info-title {
  font-size:20px; font-weight:700; letter-spacing:-.025em; margin-bottom:8px;
}
.calendar-event-list { display:flex; flex-direction:column; gap:7px; }
.calendar-event {
  display:flex; align-items:flex-start; gap:9px; color:var(--muted);
  font-size:13px; line-height:1.45;
}
.calendar-event::before {
  content:''; flex:0 0 auto; width:6px; height:6px; border-radius:50%;
  background:var(--text); margin-top:6px;
}
.calendar-empty { color:var(--muted); font-size:13px; line-height:1.55; }

.trade-card {
  border:1px solid var(--line); background:var(--soft); border-radius:18px;
  padding:18px; margin-top:2px;
}
.trade-eyebrow {
  color:var(--muted); font-size:10px; font-weight:750;
  letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px;
}
.trade-status {
  font-size:20px; font-weight:750; letter-spacing:-.03em; line-height:1.2;
}
.trade-date { color:var(--muted); font-size:12px; margin-top:7px; line-height:1.5; }
.trade-next { color:var(--muted); font-size:11px; margin-top:10px; line-height:1.5; }

@media (max-width:480px) {
  .side-panel { padding-left:20px; padding-right:20px; }
  .calendar-day { border-radius:10px; }
}

/* SHARED */
.label { margin-bottom: 18px; }
.weather-icon { display:inline-flex; align-items:center; justify-content:center; color:var(--text); flex-shrink:0; }
.weather-icon svg { display:block; width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.loading { color:var(--muted); font-size:14px; padding-top:48px; animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.38; } }

/* BUTTONS */
.px-btn {
  border:1px solid var(--text); background:var(--text); color:var(--button-text); cursor:pointer;
  padding:12px 18px; border-radius:999px; font-weight:600; font-size:13px; transition:.18s ease;
}
.px-btn:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(0,0,0,.12); }
.px-btn:active { transform:translateY(0); }
.px-btn.ghost { background:transparent; color:var(--text); border-color:var(--line); }
.px-btn.ghost:hover { background:var(--soft); box-shadow:none; }

/* DENIED */
.denied-screen { max-width:720px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(28px,5vw,56px); box-shadow:var(--shadow); }
.denied-tag { font-size:12px; color:var(--muted); margin-bottom:14px; }
.denied-title { font-size:clamp(32px,5vw,56px); line-height:1.02; letter-spacing:-.04em; margin-bottom:24px; }
.denied-desc { font-size:14px; color:var(--muted); line-height:1.75; margin-bottom:28px; }
.denied-desc strong { color:var(--text); }
.denied-btns { display:flex; flex-wrap:wrap; gap:10px; }

/* CITY PICKER */
.picker-screen { display:flex; flex-direction:column; gap:28px; }
.picker-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
.picker-title { font-size:clamp(34px,5vw,64px); font-weight:700; letter-spacing:-.05em; }
.picker-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,360px); gap:clamp(32px,6vw,88px); align-items:start; }
.city-list-wrap { column-count:2; column-gap:38px; }
.alpha-group { break-inside:avoid; margin-bottom:24px; }
.alpha-letter { font-size:12px; font-weight:700; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line); }
.city-item { display:block; padding:9px 0; border-bottom:1px solid #efefed; font-size:14px; color:#555; cursor:pointer; transition:.15s; }
.city-item:hover, .city-item.active { color:var(--text); transform:translateX(3px); }
.city-search-wrap { position:sticky; top:86px; display:flex; flex-direction:column; gap:12px; }
.city-search { width:100%; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:16px; padding:14px 16px; outline:0; }
.city-search:focus { border-color:#bdbdb8; box-shadow:0 0 0 4px rgba(0,0,0,.025); }
.city-search::placeholder { color:#aaa; }
.search-results { display:flex; flex-direction:column; max-height:50vh; overflow-y:auto; border-radius:16px; overflow:hidden; }
.sr-item { padding:12px 14px; border-bottom:1px solid var(--line); background:var(--surface); color:#555; cursor:pointer; font-size:13px; line-height:1.35; }
.sr-item:hover, .sr-item.active { color:var(--text); background:var(--soft); }
.sr-coords { display:block; font-size:11px; color:#aaa; margin-top:4px; }
.search-hint { font-size:12px; color:var(--muted); padding:10px 2px; }
.selected-box { border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px; }
.selected-name { font-size:18px; font-weight:600; }
.selected-coord { font-size:12px; color:var(--muted); }

/* WEATHER */
.clock { position:fixed; top:33px; right:28px; z-index:10; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
.layout { max-width:1500px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(250px,.72fr) minmax(220px,.62fr); gap:24px; align-items:start; }
.col-left, .col-mid, .col-right { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.col-left { padding:clamp(28px,4vw,56px); min-height:640px; }
.col-mid, .col-right { padding:26px; }
.city-name { font-size:clamp(44px,6vw,88px); font-weight:700; line-height:.95; letter-spacing:-.065em; max-width:900px; word-break:break-word; }
.coords { font-size:12px; color:var(--muted); margin:14px 0 54px; font-variant-numeric:tabular-nums; }
.hero-weather { display:flex; align-items:center; gap:24px; }
.temp-now { font-size:clamp(76px,10vw,142px); line-height:.85; letter-spacing:-.08em; font-weight:600; margin:18px 0 16px; }
.temp-unit { font-size:.24em; color:var(--muted); vertical-align:top; margin-left:8px; font-weight:500; letter-spacing:0; }
.feels { font-size:13px; color:var(--muted); margin-bottom:34px; }
.compare { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:42px; }
.compare-hl { display:flex; align-items:center; gap:8px; color:var(--text); font-weight:600; font-size:17px; margin:8px 0 3px; }
.meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); }
.meta-item { padding:20px 0 0; display:flex; flex-direction:column; gap:7px; }
.meta-val { font-size:22px; font-weight:600; letter-spacing:-.03em; }
.period-row { display:grid; grid-template-columns:minmax(75px,1fr) 32px auto; align-items:center; gap:14px; padding:17px 0; border-top:1px solid var(--line); }
.period-row:last-child, .forecast-row:last-child { border-bottom:1px solid var(--line); }
.pname, .fday { font-size:13px; color:var(--muted); }
.ptemp-wind { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.ptemp { font-size:16px; font-weight:600; }
.pwind { font-size:11px; color:#999; }
.forecast-row { display:grid; grid-template-columns:30px 26px 34px minmax(42px,1fr) 34px; align-items:center; gap:9px; padding:14px 0; border-top:1px solid var(--line); }
.fday.today { color:var(--text); font-weight:700; }
.flow, .fhigh { font-size:12px; font-variant-numeric:tabular-nums; text-align:right; }
.flow { color:var(--muted); }
.fhigh { color:var(--text); font-weight:600; }
.range-wrap { height:3px; background:var(--soft); border-radius:99px; position:relative; overflow:hidden; }
.range-fill { position:absolute; top:0; height:100%; background:#222; border-radius:99px; opacity:.65; }


/* PRIVACY + START SCREEN */
.start-screen {
  max-width: 820px;
  margin: 6vh auto 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(30px, 5vw, 58px);
  box-shadow: var(--shadow);
}
.start-kicker {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 18px;
}
.start-title {
  font-size: clamp(42px, 7vw, 82px);
  line-height: .98;
  letter-spacing: -.06em;
  margin-bottom: 20px;
}
.start-desc {
  max-width: 650px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.75;
  margin-bottom: 26px;
}
.start-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 18px;
}
.privacy-note {
  max-width: 650px;
  color: #8a8a86;
  font-size: 12px;
  line-height: 1.65;
}
.privacy-note a,
.site-footer a {
  color: inherit;
  text-underline-offset: 3px;
}
.privacy-note a:hover,
.site-footer a:hover {
  color: var(--text);
}
.site-footer {
  max-width: 1500px;
  margin: 30px auto 0;
  padding: 0 6px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  color: #8d8d89;
  font-size: 12px;
  line-height: 1.5;
}
.site-footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

@media (max-width: 1050px) {
  .layout { grid-template-columns:1fr 1fr; }
  .col-left { grid-column:1 / -1; min-height:auto; }
}
@media (max-width: 700px) {
  body { padding:82px 14px 28px; }
  .ham-btn { top:16px; left:14px; }
  .theme-btn { top:16px; right:14px; }
  .clock { top:27px; right:16px; }
  .layout { grid-template-columns:1fr; gap:14px; }
  .col-left, .col-mid, .col-right { padding:22px; border-radius:20px; }
  .col-left { grid-column:auto; }
  .city-name { font-size:clamp(42px,16vw,68px); }
  .coords { margin-bottom:38px; }
  .temp-now { font-size:clamp(78px,27vw,112px); }
  .meta { gap:12px; }
  .meta-val { font-size:18px; }
  .picker-layout { grid-template-columns:1fr; }
  .city-list-wrap { column-count:1; }
  .city-search-wrap { position:static; }
}
</style>
</head>
<body>

<button class="ham-btn" onclick="openPanel()" aria-label="Menu">
  <span></span><span></span><span></span>
</button>

<button class="theme-btn" id="theme-toggle" type="button" aria-label="Włącz ciemny motyw" aria-pressed="false">
  <span class="theme-icon theme-sun" aria-hidden="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
  </span>
  <span class="theme-icon theme-moon" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.6 8.6 0 1 0 20.5 14.2Z"></path></svg>
  </span>
</button>

<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>
<div class="side-panel" id="side-panel">
  <div class="panel-top">
    <div class="panel-title" id="panel-heading">Menu</div>
    <button class="panel-close" onclick="closePanel()" aria-label="Zamknij menu">✕</button>
  </div>

  <div class="panel-nav" role="tablist" aria-label="Menu">
    <button class="panel-tab active" id="tab-search" type="button" role="tab" aria-selected="true" onclick="switchPanelTab('search')">Miejscowość</button>
    <button class="panel-tab" id="tab-calendar" type="button" role="tab" aria-selected="false" onclick="switchPanelTab('calendar')">Kalendarz</button>
  </div>

  <div class="panel-view active" id="panel-view-search" role="tabpanel">
    <div class="search-label" style="margin-bottom:10px">Szukaj miejscowości</div>
    <input class="city-search" id="panel-search-input" type="text" placeholder="np. Zakopane" autocomplete="off" spellcheck="false" oninput="onPanelInput(this.value)"/>
    <div class="search-results" id="panel-results"></div>
    <div id="panel-selected"></div>
  </div>

  <div class="panel-view" id="panel-view-calendar" role="tabpanel">
    <div id="calendar-panel"></div>
  </div>
</div>

<div id="app"></div>
<footer class="site-footer">
  <span>© 2026 JAKDZISIAJ.PL</span>
  <span class="site-footer-links">
    <a href="privacy.html">Polityka prywatności</a>
    <span>Dane pogodowe: Open-Meteo</span>
    <span>Geokodowanie: OpenStreetMap / Nominatim</span>
  </span>
</footer>

<script>
// ── THEME ──────────────────────────────────────────────────────────────────
const themeToggle = document.getElementById('theme-toggle');
const systemPrefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;

function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  const dark = theme === 'dark';
  if(themeToggle){
    themeToggle.setAttribute('aria-pressed', String(dark));
    themeToggle.setAttribute('aria-label', dark ? 'Włącz jasny motyw' : 'Włącz ciemny motyw');
  }
}

applyTheme(systemPrefersDark ? 'dark' : 'light');

if(themeToggle){
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });
}

// ── MIN.IMAL LINE ICONS ─────────────────────────────────────────────────────
function lineIcon(type, size=24){
  const paths={
    sun:`<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>`,
    cloud:`<path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 8.2 4.5 4.5 0 0 0 7 18Z"></path>`,
    partly:`<path d="M14 4a5 5 0 0 1 4.9 6"></path><path d="M17.5 2.5 18 1M21.5 6H23M19.8 4.2l1.1-1.1"></path><path d="M7 19h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 9.2 4.5 4.5 0 0 0 7 19Z"></path>`,
    rain:`<path d="M7 15h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 5.2 4.5 4.5 0 0 0 7 15Z"></path><path d="M8 18l-1 3M13 18l-1 3M18 18l-1 3"></path>`,
    snow:`<path d="M7 14h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.3 4.2 4.5 4.5 0 0 0 7 14Z"></path><path d="M8 18h.01M12 20h.01M16 18h.01M19 21h.01"></path>`,

    up:`<path d="M12 19V5M6 11l6-6 6 6"></path>`,
    down:`<path d="M12 5v14M18 13l-6 6-6-6"></path>`,
    equal:`<path d="M5 9h14M5 15h14"></path>`
  };
  return `<span class="weather-icon" style="width:${size}px;height:${size}px"><svg viewBox="0 0 24 24" aria-hidden="true">${paths[type]||paths.cloud}</svg></span>`;
}
function iconSize(b){const w=window.innerWidth;return w<480?Math.round(b*1.15):w>1600?Math.round(b*1.2):b;}
function wmoIcon(code,b){
  const sz=iconSize(b);
  if(code===0) return lineIcon('sun',sz);
  if(code<=2) return lineIcon('partly',sz);
  if(code===3) return lineIcon('cloud',sz);
  if(code<=48) return lineIcon('fog',sz);
  if(code<=67) return lineIcon('rain',sz);
  if(code<=77) return lineIcon('snow',sz);
  if(code<=82) return lineIcon('rain',sz);
  if(code<=86) return lineIcon('snow',sz);
  return lineIcon('thunder',sz);
}
function compareIcon(key,size){ return lineIcon(key==='arrUp'?'up':key==='arrDn'?'down':'equal',size); }

function wmoDesc(code){
  if(code===0)return'Bezchmurnie';if(code<=2)return'Częściowe zachmurzenie';
  if(code===3)return'Pochmurno';if(code<=48)return'Mgła';
  if(code<=55)return'Mżawka';if(code<=67)return'Deszcz';
  if(code<=77)return'Śnieg';if(code<=82)return'Przelotny deszcz';
  if(code<=86)return'Opady śniegu';return'Burza';
}

// ── API ───────────────────────────────────────────────────────────────────
async function getCityName(lat,lon){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=pl`);
    const d=await r.json();
    return(d.address?.city||d.address?.town||d.address?.village||'TWOJA LOKALIZACJA').toUpperCase();
  }catch{return'TWOJA LOKALIZACJA';}
}
async function fetchWeather(lat,lon){
  return(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode,windspeed_10m,apparent_temperature&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&past_days=1&forecast_days=11`)).json();
}

// ── LOAD + RENDER WEATHER ─────────────────────────────────────────────────
async function loadWeather(lat,lon,cityName){
  set(`<div class="loading">Ładowanie pogody…</div>`);
  try{
    const[data,city]=await Promise.all([fetchWeather(lat,lon),cityName?Promise.resolve(cityName):getCityName(lat,lon)]);
    renderWeather(data,city,lat,lon);
  }catch(e){set(`<div class="loading">BŁĄD: ${e.message}</div>`);}
}

function renderWeather(data,city,lat,lon){
  const h=data.hourly,d=data.daily,now=new Date();
  const todayStr=now.toISOString().slice(0,10);
  const tIdx=d.time.findIndex(t=>t===todayStr),yIdx=tIdx-1;
  const hOff=h.time.findIndex(t=>t.startsWith(todayStr)),curI=hOff+now.getHours();
  const curTemp=Math.round(h.temperature_2m[curI]),curFeels=Math.round(h.apparent_temperature[curI]);
  const curCode=h.weathercode[curI],curWind=Math.round(h.windspeed_10m[curI]);
  const todayMax=d.temperature_2m_max[tIdx],todayMin=d.temperature_2m_min[tIdx];
  const yestMax=yIdx>=0?d.temperature_2m_max[yIdx]:todayMax,diff=todayMax-yestMax;
  const arrKey=diff>2?'arrUp':diff<-2?'arrDn':'arrEq';
  const cmpTxt=diff>2?`Cieplej niż wczoraj (+${Math.round(diff)}°C)`:diff<-2?`Chłodniej niż wczoraj (${Math.round(diff)}°C)`:'Podobnie jak wczoraj';

  const partsHTML=PARTS.map(p=>{
    const temps=h.temperature_2m.slice(hOff+p.s,hOff+p.e);
    const winds=h.windspeed_10m.slice(hOff+p.s,hOff+p.e);
    const codes=h.weathercode.slice(hOff+p.s,hOff+p.e);
    const code=codes[Math.floor(codes.length/2)]||0;
    return`<div class="period-row"><span class="pname">${p.name}</span>${wmoIcon(code,20)}<div class="ptemp-wind"><span class="ptemp">${Math.round(avg(temps))}°C</span><span class="pwind">${Math.round(avg(winds))} KM/H</span></div></div>`;
  }).join('');

  const forecast=[];
  for(let i=tIdx;i<Math.min(tIdx+10,d.time.length);i++){
    const dt=new Date(d.time[i]+'T12:00:00');
    forecast.push({name:DAYS[dt.getDay()],today:i===tIdx,code:d.weathercode[i],hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i])});
  }
  const allLo=forecast.map(f=>f.lo),allHi=forecast.map(f=>f.hi);
  const minT=Math.min(...allLo),maxT=Math.max(...allHi),rng=maxT-minT||1;
  const forecastHTML=forecast.map(f=>{
    const bL=((f.lo-minT)/rng*100).toFixed(1),bW=((f.hi-f.lo)/rng*100).toFixed(1);
    return`<div class="forecast-row"><span class="fday${f.today?' today':''}">${f.name}</span>${wmoIcon(f.code,16)}<span class="flow">${f.lo}°</span><div class="range-wrap"><div class="range-fill" style="left:${bL}%;width:${bW}%"></div></div><span class="fhigh">${f.hi}°</span></div>`;
  }).join('');

  set(`
    <div class="clock" id="clk">${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}</div>
    <div class="layout">
      <div class="col-left">
        <div class="label">Aktualna pogoda</div>
        <div class="city-name">${city}</div>
        <div class="coords">${lat.toFixed(4)} N  ${lon.toFixed(4)} E</div>
        <div class="hero-weather">${wmoIcon(curCode,64)}
        <div class="temp-now">${curTemp}<span class="temp-unit">°C</span></div>
        </div>
        <div class="feels">Odczuwalna ${curFeels}°C</div>
        <div class="compare">W porównaniu z wczoraj<span class="compare-hl">${compareIcon(arrKey,18)} ${cmpTxt}</span>${wmoDesc(curCode)}</div>
        <div class="meta">
          <div class="meta-item"><span class="meta-lbl">Wiatr</span><span class="meta-val">${curWind} KM/H</span></div>
          <div class="meta-item"><span class="meta-lbl">Maks.</span><span class="meta-val">${Math.round(todayMax)}°C</span></div>
          <div class="meta-item"><span class="meta-lbl">Min.</span><span class="meta-val">${Math.round(todayMin)}°C</span></div>
        </div>
      </div>
      <div class="col-mid"><div class="label">Przebieg dnia</div>${partsHTML}</div>
      <div class="col-right"><div class="label">Prognoza 10 dni</div>${forecastHTML}</div>
    </div>`);

  setInterval(()=>{const n=new Date(),el=$('clk');if(el)el.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;},1000);
}

// picker search
let pickerTimeout=null,pickerResults=[];
function onPickerSearch(val){
  clearTimeout(pickerTimeout);
  const el=$('picker-results');
  if(!el)return;
  if(!val||val.length<2){el.innerHTML='';return;}
  el.innerHTML=`<div class="search-hint">Szukam…</div>`;
  pickerTimeout=setTimeout(()=>doPickerSearch(val),420);
}
async function doPickerSearch(query){
  const el=$('picker-results');if(!el)return;
  try{
    const data=await(await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&countrycodes=pl&format=json&limit=8&accept-language=pl`)).json();
    pickerResults=data;
    if(!data.length){el.innerHTML=`<div class="sr-item" style="cursor:default;color:#222">Brak wyników</div>`;return;}
    el.innerHTML=data.map((r,i)=>{
      const name=r.display_name.split(',').slice(0,2).join(', ').toUpperCase();
      const lat=parseFloat(r.lat).toFixed(4),lon=parseFloat(r.lon).toFixed(4);
      return`<div class="sr-item" onclick="selectPickerResult(${i})">${name}<span class="sr-coords">${lat} N  ${lon} E</span></div>`;
    }).join('');
  }catch{el.innerHTML=`<div class="sr-item" style="cursor:default;color:#222">Błąd wyszukiwania</div>`;}
}
function selectPickerResult(idx){
  const r=pickerResults[idx];if(!r)return;
  const lat=parseFloat(r.lat),lon=parseFloat(r.lon);
  const name=r.display_name.split(',')[0].toUpperCase();
  document.querySelectorAll('#picker-results .sr-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const sel=$('picker-selected');
  if(sel)sel.innerHTML=`<div class="selected-box"><div class="selected-name">${name}</div><div class="selected-coord">${lat.toFixed(4)} N  ${lon.toFixed(4)} E</div><button class="px-btn" onclick="loadWeather(${lat},${lon},'${name}')">Pokaż pogodę</button></div>`;
}

let calendarSelected = new Date();

function dateKey(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function addDays(date,days){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  d.setDate(d.getDate()+days);
  return d;
}
function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31)-1;
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year,month,day);
}
function polishPublicHolidays(year){
  const easter=easterSunday(year);
  const entries=[
    [new Date(year,0,1),'Nowy Rok'],
    [new Date(year,0,6),'Święto Trzech Króli'],
    [easter,'Wielkanoc'],
    [addDays(easter,1),'Poniedziałek Wielkanocny'],
    [new Date(year,4,1),'Święto Pracy'],
    [new Date(year,4,3),'Święto Konstytucji 3 Maja'],
    [addDays(easter,49),'Zielone Świątki'],
    [addDays(easter,60),'Boże Ciało'],
    [new Date(year,7,15),'Wniebowzięcie NMP / Święto Wojska Polskiego'],
    [new Date(year,10,1),'Wszystkich Świętych'],
    [new Date(year,10,11),'Narodowe Święto Niepodległości'],
    [new Date(year,11,24),'Wigilia Bożego Narodzenia'],
    [new Date(year,11,25),'Boże Narodzenie'],
    [new Date(year,11,26),'Drugi dzień Bożego Narodzenia']
  ];
  return Object.fromEntries(entries.map(([d,n])=>[dateKey(d),n]));
}

function eventsForDate(d){
  const publicDays=polishPublicHolidays(d.getFullYear());
  const events=[];
  const pub=publicDays[dateKey(d)];
  if(pub) events.push({name:pub,publicHoliday:true});
  const k=`${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  (INTERESTING_DAYS[k]||[]).forEach(name=>{
    if(!events.some(e=>e.name===name)) events.push({name,publicHoliday:false});
  });
  return events;
}
function isPublicHoliday(d){
  return Boolean(polishPublicHolidays(d.getFullYear())[dateKey(d)]);
}
function lastSunday(year,monthIndex){
  const d=new Date(year,monthIndex+1,0);
  d.setDate(d.getDate()-d.getDay());
  return d;
}
function tradingSundays(year){
  const easter=easterSunday(year);
  const dates=[
    lastSunday(year,0),
    addDays(easter,-7),
    lastSunday(year,3),
    lastSunday(year,5),
    lastSunday(year,7)
  ];
  // Trzy kolejne niedziele poprzedzające Wigilię.
  const christmasEve=new Date(year,11,24);
  let d=addDays(christmasEve,-1);
  while(d.getDay()!==0) d=addDays(d,-1);
  dates.push(d,addDays(d,-7),addDays(d,-14));
  return dates
    .filter(d=>!isPublicHoliday(d))
    .sort((a,b)=>a-b);
}
function isTradingSunday(date){
  if(date.getDay()!==0) return false;
  return tradingSundays(date.getFullYear()).some(d=>sameDay(d,date));
}
function nextSunday(from=new Date()){
  const d=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  const add=(7-d.getDay())%7;
  return addDays(d,add);
}
function nextTradingSundayAfter(from=new Date()){
  for(let year=from.getFullYear();year<=from.getFullYear()+2;year++){
    const hit=tradingSundays(year).find(d=>d>=new Date(from.getFullYear(),from.getMonth(),from.getDate()));
    if(hit) return hit;
  }
  return null;
}
function formatLongDate(d){
  return `${WEEKDAYS_LONG[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES_GEN[d.getMonth()]} ${d.getFullYear()}`;
}
function renderCalendar(){
  const root=$('calendar-panel'); if(!root)return;
  const year=calendarCursor.getFullYear(), month=calendarCursor.getMonth();
  const first=new Date(year,month,1), daysInMonth=new Date(year,month+1,0).getDate();
  const mondayOffset=(first.getDay()+6)%7;
  const today=new Date();
  let days='';

  for(let i=0;i<mondayOffset;i++){
    days+=`<div class="calendar-day outside" aria-hidden="true"></div>`;
  }
  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(year,month,day);
    const events=eventsForDate(d);
    const classes=['calendar-day'];
    if(d.getDay()===0) classes.push('sunday');
    if(sameDay(d,today)) classes.push('today');
    if(sameDay(d,calendarSelected)) classes.push('selected');
    if(events.length) classes.push('has-event');
    if(events.some(e=>e.publicHoliday)) classes.push('public-holiday');
    const label=events.length ? `${day}. ${events.map(e=>e.name).join(', ')}` : `${day}`;
    days+=`<button type="button" class="${classes.join(' ')}" onclick="selectCalendarDay(${year},${month},${day})" aria-label="${label}">${day}</button>`;
  }

  const selectedEvents=eventsForDate(calendarSelected);
  const info=selectedEvents.length
    ? `<div class="calendar-event-list">${selectedEvents.map(e=>`<div class="calendar-event">${e.name}${e.publicHoliday?' — dzień ustawowo wolny':''}</div>`).join('')}</div>`
    : `<div class="calendar-empty">Na ten dzień nie mamy zaznaczonego dodatkowego święta ani wydarzenia.</div>`;

  const sunday=nextSunday(today);
  const trading=isTradingSunday(sunday);
  const nextTrade=trading ? sunday : nextTradingSundayAfter(addDays(sunday,1));

  root.innerHTML=`
    <div class="calendar-shell">
      <div class="calendar-head">
        <button class="calendar-nav-btn" type="button" onclick="changeCalendarMonth(-1)" aria-label="Poprzedni miesiąc">‹</button>
        <div class="calendar-month">${MONTH_NAMES[month]} ${year}</div>
        <button class="calendar-nav-btn" type="button" onclick="changeCalendarMonth(1)" aria-label="Następny miesiąc">›</button>
      </div>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>Pn</span><span>Wt</span><span>Śr</span><span>Cz</span><span>Pt</span><span>So</span><span>Nd</span>
      </div>
      <div class="calendar-grid">${days}</div>

      <div class="calendar-info">
        <div class="calendar-info-date">${formatLongDate(calendarSelected)}</div>
        <div class="calendar-info-title">${sameDay(calendarSelected,today)?'Dzisiaj':'Wybrany dzień'}</div>
        ${info}
      </div>

      <div class="trade-card">
        <div class="trade-eyebrow">Najbliższa niedziela</div>
        <div class="trade-status">${trading?'Jest handlowa':'Jest niehandlowa'}</div>
        <div class="trade-date">${formatLongDate(sunday)}</div>
        ${!trading && nextTrade ? `<div class="trade-next">Najbliższa niedziela handlowa: <strong>${nextTrade.getDate()} ${MONTH_NAMES_GEN[nextTrade.getMonth()]} ${nextTrade.getFullYear()}</strong>.</div>` : ''}
      </div>
    </div>`;
}
function selectCalendarDay(year,month,day){
  calendarSelected=new Date(year,month,day);
  renderCalendar();
}
function changeCalendarMonth(delta){
  calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+delta,1);
  calendarSelected=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1);
  renderCalendar();
}
function switchPanelTab(tab){
  const search=tab==='search';
  $('tab-search')?.classList.toggle('active',search);
  $('tab-calendar')?.classList.toggle('active',!search);
  $('tab-search')?.setAttribute('aria-selected',String(search));
  $('tab-calendar')?.setAttribute('aria-selected',String(!search));
  $('panel-view-search')?.classList.toggle('active',search);
  $('panel-view-calendar')?.classList.toggle('active',!search);
  if(!search){
    const now=new Date();
    calendarCursor=new Date(now.getFullYear(),now.getMonth(),1);
    calendarSelected=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    renderCalendar();
  }else{
    setTimeout(()=>$('panel-search-input')?.focus(),50);
  }
}

// ── SIDE PANEL SEARCH ─────────────────────────────────────────────────────
let panelTimeout=null,panelResults=[];

function openPanel(){
  $('side-panel').classList.add('open');
  $('panel-overlay').classList.add('open');
  const searchActive=$('panel-view-search')?.classList.contains('active');
  if(searchActive) setTimeout(()=>{const el=$('panel-search-input');if(el)el.focus();},200);
}
function closePanel(){
  $('side-panel').classList.remove('open');
  $('panel-overlay').classList.remove('open');
}
function onPanelInput(val){
  clearTimeout(panelTimeout);
  const el=$('panel-results');if(!el)return;
  if(!val||val.length<2){el.innerHTML='';return;}
  el.innerHTML=`<div class="search-hint">Szukam…</div>`;
  panelTimeout=setTimeout(()=>doPanelSearch(val),420);
}
async function doPanelSearch(query){
  const el=$('panel-results');if(!el)return;
  try{
    const data=await(await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&countrycodes=pl&format=json&limit=8&accept-language=pl`)).json();
    panelResults=data;
    if(!data.length){el.innerHTML=`<div class="sr-item" style="cursor:default;color:#222">Brak wyników</div>`;return;}
    el.innerHTML=data.map((r,i)=>{
      const name=r.display_name.split(',').slice(0,2).join(', ').toUpperCase();
      const lat=parseFloat(r.lat).toFixed(4),lon=parseFloat(r.lon).toFixed(4);
      return`<div class="sr-item" onclick="selectPanelResult(${i})">${name}<span class="sr-coords">${lat} N  ${lon} E</span></div>`;
    }).join('');
  }catch{el.innerHTML=`<div class="sr-item" style="cursor:default;color:#222">Błąd wyszukiwania</div>`;}
}
function selectPanelResult(idx){
  const r=panelResults[idx];if(!r)return;
  const lat=parseFloat(r.lat),lon=parseFloat(r.lon);
  const name=r.display_name.split(',')[0].toUpperCase();
  document.querySelectorAll('#panel-results .sr-item').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const sel=$('panel-selected');
  if(sel)sel.innerHTML=`<div class="selected-box"><div class="selected-name">${name}</div><div class="selected-coord">${lat.toFixed(4)} N  ${lon.toFixed(4)} E</div><button class="px-btn" onclick="closePanel();loadWeather(${lat},${lon},'${name}')">Pokaż pogodę</button></div>`;
}

// ── GPS ───────────────────────────────────────────────────────────────────
async function tryGPS(){
  set(`<div class="loading">Pobieranie lokalizacji…</div>`);
  if(!navigator.geolocation){showDenied(0);return;}
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000,enableHighAccuracy:false,maximumAge:300000})).catch(e=>({error:e}));
  if(pos?.error){showDenied(pos.error.code);return;}
  loadWeather(pos.coords.latitude,pos.coords.longitude,null);
}

function showWelcome(){
  set(`
    <section class="start-screen">
      <div class="start-kicker">JAKDZISIAJ.PL</div>
      <h1 class="start-title">Jak dzisiaj?</h1>
      <p class="start-desc">
        Sprawdź pogodę dla swojej lokalizacji albo wybierz miejscowość ręcznie.
        Lokalizacja urządzenia zostanie pobrana dopiero po kliknięciu przycisku poniżej.
      </p>
      <div class="start-actions">
        <button class="px-btn" onclick="tryGPS()">Użyj mojej lokalizacji</button>
        <button class="px-btn ghost" onclick="showCityPicker()">Wybierz miejscowość</button>
      </div>
      <p class="privacy-note">
        Po wybraniu lokalizacji współrzędne są używane do pobrania prognozy z Open-Meteo
        oraz ustalenia nazwy miejscowości przez Nominatim (OpenStreetMap).
        Serwis nie zapisuje historii lokalizacji w swojej bazie.
        Szczegóły znajdziesz w <a href="privacy.html">polityce prywatności</a>.
      </p>
    </section>
  `);
}

function init(){
  showWelcome();
}

init();
</script>
